<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#12302E" />
<title>Voorbeeldleiderschap — dagelijkse focus</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%2312302E'/><path d='M8 21l4-10 4 10M16 21l4-10 4 10' stroke='%23E0B15E' stroke-width='2.2' fill='none' stroke-linecap='round' stroke-linejoin='round'/></svg>" />
<style>
  :root{
    --ink:#12302E; --ink2:#1B403C; --paper:#F5F2E9; --paper2:#EFEBDD;
    --amber:#E0B15E; --amber-d:#C9973F; --card:#FFFFFF;
    --muted:#788983; --line:#E6E3D8; --line2:#EFEDE4;
    --shadow:0 8px 30px rgba(18,48,46,.10);
    --shadow-sm:0 3px 14px rgba(18,48,46,.07);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{
    background:var(--paper); color:var(--ink);
    font-family:'Inter',system-ui,-apple-system,sans-serif;
    -webkit-font-smoothing:antialiased;min-height:100vh;
    background-image:radial-gradient(circle at 100% 0%, rgba(224,177,94,.06), transparent 42%),
                     radial-gradient(circle at 0% 100%, rgba(18,48,46,.05), transparent 40%);
    background-attachment:fixed;
  }
  .wrap{max-width:560px;margin:0 auto;padding:0 0 72px}
  button{font-family:inherit;cursor:pointer}
  .serif{font-family:'Fraunces',Georgia,serif}
  .eyebrow{font-size:11px;letter-spacing:2.5px;text-transform:uppercase;font-weight:600}
  .hidden{display:none !important}

  /* ---------- Login ---------- */
  #login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
  .login-card{width:100%;max-width:400px;background:var(--card);border-radius:22px;box-shadow:var(--shadow);overflow:hidden}
  .login-head{background:var(--ink);color:var(--paper);padding:32px 30px 28px;position:relative;overflow:hidden}
  .login-head::after{content:"";position:absolute;right:-40px;top:-40px;width:160px;height:160px;border-radius:50%;background:radial-gradient(circle,rgba(224,177,94,.16),transparent 70%)}
  .logo-mark{display:flex;gap:11px;align-items:center;margin-bottom:20px;position:relative}
  .login-head h1{margin:0;font-size:26px;font-weight:600;line-height:1.1;position:relative}
  .login-head p{margin:10px 0 0;font-size:14px;opacity:.82;line-height:1.45;position:relative}
  .login-body{padding:26px 30px 30px}
  .field{margin-bottom:15px}
  .field label{display:block;font-size:12.5px;font-weight:600;color:var(--muted);margin-bottom:7px;letter-spacing:.2px}
  .field input{width:100%;padding:13px 14px;border-radius:12px;border:1.5px solid var(--line);font-size:16px;font-family:inherit;color:var(--ink);background:#FCFBF6;outline:none;transition:border-color .15s,box-shadow .15s}
  .field input:focus{border-color:var(--ink);box-shadow:0 0 0 3px rgba(18,48,46,.08)}
  .btn-primary{width:100%;padding:14px;border:none;border-radius:12px;background:var(--ink);color:var(--paper);font-size:16px;font-weight:600;margin-top:6px;transition:transform .12s,background .15s}
  .btn-primary:active{transform:scale(.985)}
  .btn-primary:disabled{opacity:.5}
  .login-msg{font-size:13.5px;margin-top:14px;line-height:1.4;min-height:18px}
  .login-msg.err{color:#C0492B}
  .login-foot{text-align:center;font-size:12px;color:var(--muted);padding:0 30px 24px}

  #config-warn{margin:24px;padding:20px 22px;border-radius:16px;background:#FBEDE7;border:1px solid #E1785A;color:#8A3A24;font-size:14.5px;line-height:1.55}
  #config-warn code{background:#fff;padding:1px 6px;border-radius:5px;font-size:13px}

  /* ---------- Header ---------- */
  header.app{background:var(--ink);color:var(--paper);padding:20px 22px 20px;border-radius:0 0 24px 24px;position:relative;overflow:hidden}
  header.app::after{content:"";position:absolute;right:-50px;top:-60px;width:190px;height:190px;border-radius:50%;background:radial-gradient(circle,rgba(224,177,94,.13),transparent 70%);pointer-events:none}
  .head-row{display:flex;justify-content:space-between;align-items:center;gap:10px;position:relative}
  .brand{display:flex;align-items:center;gap:9px;min-width:0}
  .brand .eyebrow{opacity:.72;font-size:10.5px;letter-spacing:1.8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .head-right{display:flex;align-items:center;gap:9px;flex-shrink:0}
  .whoChip{font-size:11.5px;opacity:.75;max-width:96px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .logoutBtn{background:rgba(255,255,255,.10);border:none;color:var(--paper);font-size:12px;padding:7px 11px;border-radius:9px;font-weight:500;white-space:nowrap}
  .head-date{font-size:14.5px;opacity:.85;margin-top:14px;text-transform:capitalize;position:relative}

  .pyr-strip{display:flex;gap:5px;margin-top:14px;position:relative}
  .pyr-seg{flex:1;height:6px;border-radius:3px;background:rgba(255,255,255,.16)}
  .pyr-seg.active{background:var(--amber)}
  .pyr-seg.done{background:rgba(224,177,94,.5)}
  .pyr-label{display:flex;justify-content:space-between;margin-top:7px;font-size:10px;letter-spacing:.3px;opacity:.6;position:relative}
  .pyr-label span{flex:1;text-align:center}
  .pyr-label span.on{opacity:1;color:var(--amber);font-weight:600}

  .tabs{display:flex;gap:8px;margin-top:18px;position:relative}
  .tabs button{flex:1;padding:10px 0;border-radius:11px;border:none;font-size:14px;font-weight:600;background:rgba(255,255,255,.10);color:var(--paper);transition:background .15s,color .15s}
  .tabs button.active{background:var(--paper);color:var(--ink)}

  main{padding:20px 18px 0}

  /* ---------- Focus card ---------- */
  .focus{background:var(--card);border-radius:20px;overflow:hidden;box-shadow:var(--shadow)}
  .focus-top{padding:22px 22px 22px;color:#fff;position:relative;overflow:hidden}
  .focus-top::before{content:"";position:absolute;inset:0;background:linear-gradient(135deg,rgba(255,255,255,.08),transparent 55%);pointer-events:none}
  .focus-grid{display:flex;align-items:center;gap:18px;position:relative}
  .ring{position:relative;width:82px;height:82px;flex-shrink:0}
  .ring svg{display:block}
  .ring .rnum{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1}
  .ring .rnum b{font-size:22px;font-weight:700;font-family:'Fraunces',serif}
  .ring .rnum small{font-size:10px;opacity:.8;margin-top:1px}
  .focus-meta{min-width:0}
  .focus-meta .eyebrow{opacity:.82}
  .focus-name{font-size:29px;font-weight:600;margin-top:5px;letter-spacing:-.3px}
  .focus-tag{font-size:14.5px;opacity:.88;margin-top:1px}
  .focus-q{margin:18px 0 0;background:rgba(255,255,255,.13);border-radius:13px;padding:13px 15px;font-size:15px;line-height:1.4;position:relative;border:1px solid rgba(255,255,255,.09)}
  .focus-q em{font-style:normal;font-family:'Fraunces',serif;font-size:15.5px}
  .focus-q .qlab{display:block;font-size:10.5px;letter-spacing:1.5px;text-transform:uppercase;opacity:.7;margin-bottom:4px;font-weight:600}

  .beh-wrap{padding:18px 20px 6px}
  .beh-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
  .beh-head .eyebrow{color:var(--muted);letter-spacing:1.5px}
  .badge{font-size:12px;font-weight:700;padding:4px 11px;border-radius:20px;background:var(--paper2);color:#9AA3A1;white-space:nowrap;transition:all .2s}
  .row{display:flex;align-items:flex-start;gap:13px;width:100%;text-align:left;background:transparent;border:none;padding:12px 0;border-top:1px solid var(--line2)}
  .row:first-of-type{border-top:none}
  .row span.txt{font-size:15.5px;line-height:1.38;color:#42524E;transition:color .15s}
  .row.on span.txt{color:var(--ink)}
  .chk{width:23px;height:23px;border-radius:7px;flex-shrink:0;border:2px solid #C3CBC7;display:inline-flex;align-items:center;justify-content:center;transition:all .18s cubic-bezier(.34,1.56,.64,1);margin-top:1px}
  .chk svg{display:none}
  .chk.on svg{display:block}
  .chk.pop{animation:pop .3s cubic-bezier(.34,1.56,.64,1)}
  @keyframes pop{0%{transform:scale(.7)}60%{transform:scale(1.15)}100%{transform:scale(1)}}
  .crit{margin:8px 20px 20px;border-radius:14px;padding:15px 17px;position:relative}
  .crit .eyebrow{letter-spacing:1.5px}
  .crit p{margin:6px 0 0;font-size:15px;line-height:1.42;color:#2E3E3C}

  .done-banner{margin:0 20px 18px;border-radius:14px;padding:14px 16px;background:linear-gradient(120deg,var(--amber),#EBC989);color:var(--ink);display:flex;align-items:center;gap:12px;font-size:14.5px;font-weight:600;box-shadow:0 4px 16px rgba(224,177,94,.35);animation:rise .4s ease}
  @keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

  /* ---------- Quick check ---------- */
  .quick{margin-top:16px;background:var(--ink);color:var(--paper);border-radius:20px;padding:20px 20px 16px;position:relative;overflow:hidden}
  .quick::after{content:"";position:absolute;left:-40px;bottom:-50px;width:150px;height:150px;border-radius:50%;background:radial-gradient(circle,rgba(224,177,94,.10),transparent 70%)}
  .quick-head{display:flex;justify-content:space-between;align-items:center;position:relative}
  .quick-head strong{font-size:16px;font-weight:600}
  .quick-head span{font-size:12.5px;opacity:.72}
  .qrow{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:transparent;border:none;padding:10px 0;border-top:1px solid rgba(255,255,255,.09);position:relative}
  .qrow:first-of-type{border-top:none}
  .qrow span.txt{font-size:15px;color:rgba(245,242,233,.82);transition:color .15s}
  .qrow.on span.txt{color:#fff}

  /* ---------- Note ---------- */
  .note{margin-top:16px;background:var(--card);border-radius:20px;padding:19px 20px;box-shadow:var(--shadow-sm)}
  .note label{font-size:11px;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted);font-weight:700}
  .note textarea{width:100%;margin-top:10px;resize:vertical;border-radius:12px;border:1.5px solid var(--line);padding:12px 13px;font-size:15px;line-height:1.45;font-family:inherit;color:var(--ink);background:#FCFBF6;outline:none;transition:border-color .15s}
  .note textarea:focus{border-color:var(--ink)}
  .saved{font-size:12.5px;color:#3F8A6E;opacity:0;transition:opacity .2s;height:16px;margin-top:5px;display:block;font-weight:500}
  .saved.show{opacity:1}

  .footnote{text-align:center;font-size:12.5px;color:#9AA098;margin-top:22px;line-height:1.55;padding:0 16px}

  /* ---------- Week ---------- */
  .week-card{background:var(--card);border-radius:20px;padding:22px 20px 10px;box-shadow:var(--shadow)}
  .week-card h2{margin:0;font-size:20px;font-weight:600}
  .week-card .sub{font-size:13.5px;color:var(--muted);margin:5px 0 6px;line-height:1.4}
  .streak{display:flex;align-items:center;gap:8px;margin:14px 0 4px;padding:12px 14px;background:var(--paper2);border-radius:12px;font-size:13.5px;color:var(--ink)}
  .streak b{font-family:'Fraunces',serif;font-size:17px}
  .wrow{display:flex;align-items:center;gap:14px;padding:13px 0;border-top:1px solid var(--line2)}
  .wrow .wbar{width:9px;height:42px;border-radius:5px;flex-shrink:0}
  .wrow .name{font-size:15px;font-weight:600}
  .wrow .date{font-size:12.5px;color:#9AA098;text-transform:capitalize;margin-top:1px}
  .empty{padding:26px 0 30px;text-align:center;color:#9AA3A1;font-size:15px;line-height:1.5}
  .week-tip{margin-top:16px;background:var(--ink);color:var(--paper);border-radius:18px;padding:18px 20px;font-size:13px;opacity:.96;line-height:1.55}
  .week-tip strong{color:var(--amber)}
  .tools{display:flex;gap:10px;margin-top:14px}
  .tools button{flex:1;padding:12px;border-radius:12px;border:1.5px solid var(--line);background:#fff;color:var(--ink);font-size:14px;font-weight:600;transition:background .15s}
  .tools button:active{background:var(--paper2)}
  .tools button.danger{border-color:#E7C4B8;color:#B34A2C}

  /* accessibility */
  .row:focus-visible,.qrow:focus-visible,.tabs button:focus-visible,.tools button:focus-visible,.logoutBtn:focus-visible,.btn-primary:focus-visible{outline:2.5px solid var(--amber);outline-offset:2px;border-radius:8px}
  @media (prefers-reduced-motion: reduce){
    *{animation-duration:.001ms !important;transition-duration:.001ms !important}
  }
</style>
</head>
<body>

<!-- ============ LOGIN ============ -->
<div id="login">
  <div class="login-card">
    <div class="login-head">
      <div class="logo-mark">
        <svg width="36" height="36" viewBox="0 0 32 32"><rect width="32" height="32" rx="8" fill="#E0B15E"/><path d="M8 22l4-11 4 11M16 22l4-11 4 11" stroke="#12302E" stroke-width="2.3" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <span class="eyebrow" style="opacity:.72">Atlas Copco</span>
      </div>
      <h1 class="serif">Voorbeeldleiderschap</h1>
      <p>Dagelijkse focus voor de dagstart. Log in met de gegevens die je van je leidinggevende kreeg.</p>
    </div>
    <div class="login-body">
      <div class="field">
        <label for="email">E-mail</label>
        <input id="email" type="email" autocomplete="username" inputmode="email" placeholder="jouw.naam@bedrijf.be" />
      </div>
      <div class="field">
        <label for="pw">Wachtwoord</label>
        <input id="pw" type="password" autocomplete="current-password" placeholder="••••••••" />
      </div>
      <button class="btn-primary" id="loginBtn">Inloggen</button>
      <div class="login-msg" id="loginMsg"></div>
    </div>
    <div class="login-foot">Je gegevens blijven privé en volgen jouw account.</div>
  </div>
</div>

<!-- ============ APP ============ -->
<div id="app" class="hidden">
  <div class="wrap">
    <header class="app">
      <div class="head-row">
        <div class="brand">
          <svg width="24" height="24" viewBox="0 0 32 32"><rect width="32" height="32" rx="7" fill="#E0B15E"/><path d="M8 22l4-11 4 11M16 22l4-11 4 11" stroke="#12302E" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
          <span class="eyebrow">Voorbeeldleiderschap</span>
        </div>
        <div class="head-right">
          <span class="whoChip" id="whoLabel"></span>
          <button class="logoutBtn" id="logoutBtn">Uitloggen</button>
        </div>
      </div>
      <div class="head-date" id="dateLabel"></div>
      <div class="pyr-strip" id="pyrStrip"></div>
      <div class="pyr-label" id="pyrLabel"></div>
      <div class="tabs">
        <button id="tabToday" class="active">Vandaag</button>
        <button id="tabWeek">Deze week</button>
      </div>
    </header>
    <main id="view"></main>
  </div>
</div>

<script type="module">
// ============================================================
//  FIREBASE CONFIG  —  vervang dit blok met je eigen gegevens
//  (Firebase console → Projectinstellingen → Je apps → SDK-config)
// ============================================================
const firebaseConfig = {
  apiKey: "AIzaSyCuoSl9fLpFoUoTDDrpVjM-MR0GhqWCVt0",
  authDomain: "voorbeeldleiderschap.firebaseapp.com",
  projectId: "voorbeeldleiderschap",
  storageBucket: "voorbeeldleiderschap.firebasestorage.app",
  messagingSenderId: "919633993170",
  appId: "1:919633993170:web:355aad73fc84fe32e97c0b"
};
// ============================================================

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged, setPersistence, browserLocalPersistence } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, doc, getDoc, setDoc, collection, getDocs, deleteDoc, query, orderBy } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const LAYERS = [
  { key:"vertrouwen", name:"Vertrouwen", short:"Vertr.", tagline:"Elkaar helpen", color:"#1F4E4C", tint:"#E7EEEC",
    behaviors:["Ik gebruik bewust wij-taal in plaats van ik-taal.","Ik vraag actief input van anderen voor ik beslis.","Ik toon dat hulp vragen normaal is.","Ik reageer rustig op fouten, vragen of onzekerheid.","Ik betrek ook stille mensen in de dagstart."],
    check:"Spreekt het team spontaan open, of wacht het team op mij?", question:"Hoe pakken wij dit samen aan?" },
  { key:"conflict", name:"Conflict", short:"Confl.", tagline:"Alles durven zeggen", color:"#5E7772", tint:"#ECEFEE",
    behaviors:["Ik vraag expliciet naar andere meningen.","Ik nodig risico’s, twijfels en bedenkingen uit.","Ik onderbreek discussie niet te snel met mijn oplossing.","Ik reageer neutraal op tegenspraak.","Ik benoem problemen voordat ze groter worden."],
    check:"Wordt er op een veilige manier tegengesproken in de dagstart?", question:"Wie ziet risico’s, twijfels of iets dat wij missen?" },
  { key:"toewijding", name:"Toewijding", short:"Toew.", tagline:"Afspraak is afspraak", color:"#8A97A6", tint:"#EDEFF2",
    behaviors:["Ik check na de taakverdeling of iedereen gecommitteerd is.","Ik vraag of er nog bedenkingen zijn voor we starten.","Ik herhaal de belangrijkste prioriteit van vandaag.","Ik maak verwachtingen expliciet en niet vanzelfsprekend.","Ik sluit af met duidelijkheid over wat eerst moet gebeuren."],
    check:"Weet iedereen na de dagstart exact wat te doen en waarom?", question:"Wat is ons gezamenlijke doel en wat heeft nu voorrang?" },
  { key:"verantwoording", name:"Verantwoording", short:"Verantw.", tagline:"Elkaar aanspreken", color:"#E1785A", tint:"#FBEDE7",
    behaviors:["Ik maak afspraken concreet: wie, wat, wanneer en welke standaard.","Ik spreek op gedrag en niet op de persoon.","Ik benoem afwijkingen direct en rustig.","Ik laat ruimte dat teamleden elkaar aanspreken.","Ik accepteer geen vage afspraken zoals “we zien wel”."],
    check:"Spreekt het team elkaar aan zonder dat ik alles moet dragen?", question:"Wie doet wat, tegen wanneer en volgens welke standaard?" },
  { key:"resultaten", name:"Resultaten", short:"Result.", tagline:"Onze targets", color:"#D2A857", tint:"#F8F1E1",
    behaviors:["Ik link afspraken aan veiligheid, kwaliteit, output of samenwerking.","Ik maak duidelijk waarom het gedrag belangrijk is.","Ik benoem concreet wat er beter gaat dan gisteren.","Ik sluit af met focus op het teamresultaat.","Ik trek één les mee naar morgen."],
    check:"Is de link tussen gedrag en resultaat duidelijk voor iedereen?", question:"Wat betekent dit voor veiligheid, kwaliteit of samenwerking?" },
];
const QUICK = ["Heb ik wij-taal gebruikt?","Heeft iemand anders gesproken?","Is de link met resultaat duidelijk?","Heb ik minstens één echte vraag gesteld?","Zijn afspraken concreet?"];
const INK="#12302E", AMBER="#E0B15E";

const pad = n => String(n).padStart(2,"0");
function todayKey(d=new Date()){ return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; }
function focusIndexFor(d=new Date()){ const s=new Date(d.getFullYear(),0,0); const day=Math.floor((d-s)/86400000); return day%LAYERS.length; }
function dutchDate(d=new Date()){
  const days=["zondag","maandag","dinsdag","woensdag","donderdag","vrijdag","zaterdag"];
  const m=["januari","februari","maart","april","mei","juni","juli","augustus","september","oktober","november","december"];
  return `${days[d.getDay()]} ${d.getDate()} ${m[d.getMonth()]}`;
}
const CHECK_SVG = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none"><path d="M5 13l4 4L19 7" stroke="#fff" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/></svg>';
const esc = s => (s||"").replace(/[&<>"']/g, c=>({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));

const CONFIG_OK = !JSON.stringify(firebaseConfig).includes("VERVANG_MIJ");
let app, auth, db, user=null;
let state = { beh:{}, quick:[false,false,false,false,false], note:"" };
let currentTab = "today";
let saveTimer=null;

function showConfigWarning(){
  document.getElementById("login").innerHTML =
    '<div id="config-warn">⚙️ <strong>Nog even instellen.</strong><br><br>' +
    'De app is nog niet gekoppeld aan Firebase. Open <code>index.html</code>, zoek bovenaan het blok ' +
    '<code>firebaseConfig</code> en vervang de <code>VERVANG_MIJ</code>-waarden met je eigen gegevens uit de Firebase-console. ' +
    'De stappen staan in <code>HANDLEIDING.md</code>.</div>';
  document.getElementById("login").style.display="block";
}

if(!CONFIG_OK){
  showConfigWarning();
} else {
  app = initializeApp(firebaseConfig);
  auth = getAuth(app);
  db = getFirestore(app);
  setPersistence(auth, browserLocalPersistence);
  onAuthStateChanged(auth, async (u)=>{
    if(u){
      user=u;
      document.getElementById("login").classList.add("hidden");
      document.getElementById("app").classList.remove("hidden");
      document.getElementById("whoLabel").textContent = u.email;
      await loadToday();
      render();
    } else {
      user=null;
      document.getElementById("app").classList.add("hidden");
      document.getElementById("login").classList.remove("hidden");
    }
  });
}

const loginBtn = document.getElementById("loginBtn");
const loginMsg = document.getElementById("loginMsg");
async function doLogin(){
  const email = document.getElementById("email").value.trim();
  const pw = document.getElementById("pw").value;
  if(!email || !pw){ loginMsg.className="login-msg err"; loginMsg.textContent="Vul e-mail en wachtwoord in."; return; }
  loginBtn.disabled=true; loginMsg.className="login-msg"; loginMsg.textContent="Bezig met inloggen…";
  try{ await signInWithEmailAndPassword(auth, email, pw); loginMsg.textContent=""; }
  catch(e){
    loginMsg.className="login-msg err";
    const code=(e&&e.code)||"";
    loginMsg.textContent = code.includes("invalid-cred")||code.includes("wrong-password")||code.includes("user-not-found")
      ? "E-mail of wachtwoord klopt niet." : code.includes("too-many")
      ? "Te veel pogingen. Probeer het straks opnieuw." : "Inloggen lukte niet. Controleer je gegevens.";
  }finally{ loginBtn.disabled=false; }
}
if(loginBtn){
  loginBtn.addEventListener("click", doLogin);
  document.getElementById("pw").addEventListener("keydown", e=>{ if(e.key==="Enter") doLogin(); });
  document.getElementById("email").addEventListener("keydown", e=>{ if(e.key==="Enter") document.getElementById("pw").focus(); });
}
const logoutBtn = document.getElementById("logoutBtn");
if(logoutBtn) logoutBtn.addEventListener("click", ()=> signOut(auth));

function docRef(dayKey){ return doc(db, "users", user.uid, "days", dayKey); }
async function loadToday(){
  state = { beh:{}, quick:[false,false,false,false,false], note:"" };
  try{
    const snap = await getDoc(docRef(todayKey()));
    if(snap.exists()){ const d=snap.data(); state.beh=d.beh||{}; state.quick=d.quick||[false,false,false,false,false]; state.note=d.note||""; }
  }catch(e){}
}
async function save(){
  const payload = { ...state, focusIdx: focusIndexFor(), ts: Date.now() };
  try{ await setDoc(docRef(todayKey()), payload, { merge:true }); flashSaved(); }catch(e){}
}
function queueSave(){ clearTimeout(saveTimer); saveTimer=setTimeout(save, 400); }
function flashSaved(){ const el=document.getElementById("savedFlag"); if(el){ el.classList.add("show"); setTimeout(()=>el.classList.remove("show"),1200);} }

document.getElementById("tabToday").addEventListener("click", ()=>{ currentTab="today"; setTabUI(); render(); });
document.getElementById("tabWeek").addEventListener("click", ()=>{ currentTab="week"; setTabUI(); render(); });
function setTabUI(){
  document.getElementById("tabToday").classList.toggle("active", currentTab==="today");
  document.getElementById("tabWeek").classList.toggle("active", currentTab==="week");
}

function renderHeader(){
  const idx=focusIndexFor();
  document.getElementById("dateLabel").textContent = dutchDate();
  const strip=document.getElementById("pyrStrip");
  const label=document.getElementById("pyrLabel");
  strip.innerHTML=""; label.innerHTML="";
  LAYERS.forEach((L,i)=>{
    const seg=document.createElement("div");
    seg.className="pyr-seg"+(i===idx?" active":i<idx?" done":"");
    strip.appendChild(seg);
    const sp=document.createElement("span");
    sp.textContent=L.short; if(i===idx) sp.className="on";
    label.appendChild(sp);
  });
}

function render(){
  renderHeader();
  const view=document.getElementById("view");
  if(currentTab==="today") renderToday(view); else renderWeek(view);
}

function ringSVG(pct){
  const r=36, c=2*Math.PI*r, off=c*(1-pct);
  return `<svg width="82" height="82" viewBox="0 0 82 82">
    <g transform="rotate(-90 41 41)">
    <circle cx="41" cy="41" r="${r}" fill="none" stroke="rgba(255,255,255,.20)" stroke-width="6"/>
    <circle cx="41" cy="41" r="${r}" fill="none" stroke="#fff" stroke-width="6" stroke-linecap="round"
      stroke-dasharray="${c.toFixed(1)}" stroke-dashoffset="${off.toFixed(1)}" style="transition:stroke-dashoffset .5s cubic-bezier(.4,0,.2,1)"/>
    </g></svg>`;
}

function renderToday(view){
  const idx=focusIndexFor(); const L=LAYERS[idx];
  const beh=state.beh[L.key]||[false,false,false,false,false];
  const behCount=beh.filter(Boolean).length;
  const quickCount=state.quick.filter(Boolean).length;

  view.innerHTML = `
    <section class="focus">
      <div class="focus-top" style="background:${L.color}">
        <div class="focus-grid">
          <div class="ring">${ringSVG(behCount/5)}<div class="rnum"><b id="ringNum">${behCount}</b><small>van 5</small></div></div>
          <div class="focus-meta">
            <div class="eyebrow">Vandaag · Laag ${idx+1} van 5</div>
            <div class="focus-name serif">${L.name}</div>
            <div class="focus-tag">${L.tagline}</div>
          </div>
        </div>
        <div class="focus-q"><span class="qlab">Vraag om te stellen</span><em>“${esc(L.question)}”</em></div>
      </div>
      <div class="beh-wrap">
        <div class="beh-head">
          <span class="eyebrow">Vink af wat je vandaag deed</span>
          <span class="badge" id="behBadge">${behCount}/5</span>
        </div>
        <div id="behList"></div>
      </div>
      <div id="doneSlot"></div>
      <div class="crit" style="background:${L.tint}">
        <div class="eyebrow" style="color:${L.color}">Kritische check</div>
        <p>${esc(L.check)}</p>
      </div>
    </section>

    <section class="quick">
      <div class="quick-head"><strong>Dagstart quick check</strong><span>30 sec · <span id="quickCount">${quickCount}</span>/5</span></div>
      <div id="quickList"></div>
    </section>

    <section class="note">
      <label for="noteInput">Notitie van vandaag</label>
      <textarea id="noteInput" rows="3" placeholder="Wat viel op? Wat neem je mee naar morgen?">${esc(state.note)}</textarea>
      <span class="saved" id="savedFlag">✓ Opgeslagen</span>
    </section>

    <p class="footnote">De focus rouleert elke dag langs de vijf lagen. Kleine herhaling zorgt voor duurzame verandering.</p>
  `;

  const behList=view.querySelector("#behList");
  L.behaviors.forEach((b,i)=>{
    const btn=document.createElement("button");
    btn.className="row"+(beh[i]?" on":"");
    btn.innerHTML=`<span class="chk${beh[i]?" on":""}" style="${beh[i]?`background:${L.color};border-color:${L.color}`:""}">${CHECK_SVG}</span><span class="txt">${esc(b)}</span>`;
    btn.addEventListener("click",()=>{
      const arr=(state.beh[L.key]||[false,false,false,false,false]).slice();
      arr[i]=!arr[i]; state.beh[L.key]=arr;
      const c=arr.filter(Boolean).length;
      const badge=view.querySelector("#behBadge");
      badge.textContent=`${c}/5${c>=3?" · goed bezig":""}`;
      badge.style.background=c>=3?L.tint:"var(--paper2)"; badge.style.color=c>=3?L.color:"#9AA3A1";
      btn.classList.toggle("on",arr[i]);
      const chk=btn.querySelector(".chk");
      chk.classList.toggle("on",arr[i]);
      if(arr[i]){ chk.classList.add("pop"); setTimeout(()=>chk.classList.remove("pop"),300); }
      chk.style.cssText=arr[i]?`background:${L.color};border-color:${L.color}`:"";
      view.querySelector(".ring").innerHTML=ringSVG(c/5)+`<div class="rnum"><b id="ringNum">${c}</b><small>van 5</small></div>`;
      updateDoneSlot(view,L);
      queueSave();
    });
    behList.appendChild(btn);
  });
  const badge=view.querySelector("#behBadge");
  if(behCount>=3){ badge.textContent=`${behCount}/5 · goed bezig`; badge.style.background=L.tint; badge.style.color=L.color; }

  const qList=view.querySelector("#quickList");
  QUICK.forEach((q,i)=>{
    const btn=document.createElement("button");
    btn.className="qrow"+(state.quick[i]?" on":"");
    btn.innerHTML=`<span class="chk${state.quick[i]?" on":""}" style="${state.quick[i]?`background:${AMBER};border-color:${AMBER}`:""}">${CHECK_SVG}</span><span class="txt">${esc(q)}</span>`;
    btn.addEventListener("click",()=>{
      state.quick[i]=!state.quick[i];
      btn.classList.toggle("on",state.quick[i]);
      const chk=btn.querySelector(".chk");
      chk.classList.toggle("on",state.quick[i]);
      if(state.quick[i]){ chk.classList.add("pop"); setTimeout(()=>chk.classList.remove("pop"),300); }
      chk.style.cssText=state.quick[i]?`background:${AMBER};border-color:${AMBER}`:"";
      view.querySelector("#quickCount").textContent=state.quick.filter(Boolean).length;
      updateDoneSlot(view,L);
      queueSave();
    });
    qList.appendChild(btn);
  });

  const ta=view.querySelector("#noteInput");
  ta.addEventListener("input",()=>{ state.note=ta.value; queueSave(); });

  updateDoneSlot(view,L);
}

function updateDoneSlot(view,L){
  const slot=view.querySelector("#doneSlot");
  if(!slot) return;
  const beh=state.beh[L.key]||[];
  const behCount=beh.filter(Boolean).length;
  const quickCount=state.quick.filter(Boolean).length;
  if(behCount===5 && quickCount===5){
    if(!slot.querySelector(".done-banner")){
      slot.innerHTML=`<div class="done-banner">✓ Alles afgevinkt voor vandaag. Sterk werk — tot morgen.</div>`;
    }
  } else {
    slot.innerHTML="";
  }
}

async function renderWeek(view){
  view.innerHTML=`<section class="week-card"><h2 class="serif">Jouw laatste dagen</h2><p class="sub">Laden…</p></section>`;
  let entries=[];
  try{
    const q=query(collection(db,"users",user.uid,"days"), orderBy("ts","desc"));
    const snap=await getDocs(q); snap.forEach(d=>entries.push({key:d.id,data:d.data()}));
  }catch(e){
    try{ const snap=await getDocs(collection(db,"users",user.uid,"days")); snap.forEach(d=>entries.push({key:d.id,data:d.data()})); entries.sort((a,b)=>a.key<b.key?1:-1);}catch(_){}
  }
  const recent=entries.slice(0,7);
  const goodDays = entries.filter(e=>{ const li=typeof e.data.focusIdx==="number"?e.data.focusIdx:0; const L=LAYERS[li]||LAYERS[0]; return ((e.data.beh&&e.data.beh[L.key])||[]).filter(Boolean).length>=3; }).length;

  let rows="";
  if(recent.length===0){
    rows=`<div class="empty">Nog niets ingevuld.<br>Begin bij het tabblad <strong style="color:${INK}">Vandaag</strong>.</div>`;
  } else {
    recent.forEach(({key,data})=>{
      const li=typeof data.focusIdx==="number"?data.focusIdx:0;
      const L=LAYERS[li]||LAYERS[0];
      const beh=(data.beh&&data.beh[L.key])||[];
      const c=beh.filter(Boolean).length;
      const d=new Date(key+"T00:00:00");
      rows+=`<div class="wrow">
        <div class="wbar" style="background:${L.color}"></div>
        <div style="flex:1;min-width:0"><div class="name">${L.name}</div><div class="date">${dutchDate(d)}</div></div>
        <div style="text-align:right">
          <span class="badge" style="${c>=3?`background:${L.tint};color:${L.color}`:""}">${c}/5</span>
          ${data.note?`<div style="font-size:11.5px;color:#A7AEAB;margin-top:4px">notitie ✓</div>`:""}
        </div></div>`;
    });
  }

  const streakHtml = entries.length? `<div class="streak">🔥 <span><b>${goodDays}</b> ${goodDays===1?"dag":"dagen"} met 3+ vinkjes per laag</span></div>` : "";

  view.innerHTML=`
    <section class="week-card">
      <h2 class="serif">Jouw laatste dagen</h2>
      <p class="sub">Wat je per dag hebt afgevinkt. Drie of meer per laag betekent: goed bezig.</p>
      ${streakHtml}
      ${rows}
    </section>
    <div class="tools">
      <button id="exportBtn">Exporteer als tekst</button>
      <button id="wipeBtn" class="danger">Wis mijn data</button>
    </div>
    <section class="week-tip"><strong>Onthoud:</strong> de checklist is een leerinstrument, geen controlelijst. Vul eerlijk in — zo wordt coaching concreter en minder afhankelijk van gevoel.</section>
  `;
  view.querySelector("#exportBtn").addEventListener("click", ()=>exportData(entries));
  view.querySelector("#wipeBtn").addEventListener("click", ()=>wipeData(entries));
}

function exportData(entries){
  let out=`Voorbeeldleiderschap — export voor ${user.email}\nGemaakt: ${new Date().toLocaleString("nl-BE")}\n\n`;
  entries.slice().sort((a,b)=>a.key<b.key?-1:1).forEach(({key,data})=>{
    const li=typeof data.focusIdx==="number"?data.focusIdx:0; const L=LAYERS[li]||LAYERS[0];
    const beh=(data.beh&&data.beh[L.key])||[]; const c=beh.filter(Boolean).length; const q=(data.quick||[]).filter(Boolean).length;
    out+=`${key} — ${L.name}: ${c}/5 gedragingen, quick check ${q}/5\n`;
    if(data.note) out+=`   notitie: ${data.note}\n`;
  });
  const blob=new Blob([out],{type:"text/plain;charset=utf-8"});
  const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download=`leiderschap-export-${todayKey()}.txt`; a.click(); URL.revokeObjectURL(a.href);
}
async function wipeData(entries){
  if(!confirm("Weet je zeker dat je al je opgeslagen dagen wilt verwijderen? Dit kan niet ongedaan worden gemaakt.")) return;
  for(const {key} of entries){ try{ await deleteDoc(doc(db,"users",user.uid,"days",key)); }catch(e){} }
  state={ beh:{}, quick:[false,false,false,false,false], note:"" };
  alert("Je gegevens zijn gewist."); render();
}
</script>
