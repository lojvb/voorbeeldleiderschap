<style>
  :root{
    --ink:#12302E; --ink2:#1B403C; --paper:#F5F2E9; --paper2:#EFEBDD;
    --amber:#E0B15E; --amber-d:#C9973F; --card:#FFFFFF;
    --muted:#6A7A74; --line:#E6E3D8; --line2:#EFEDE4;
    --shadow:0 8px 30px rgba(18,48,46,.10);
    --shadow-sm:0 3px 14px rgba(18,48,46,.07);
    --fs:1; /* tekstgrootte-schaal, aangepast door knop */
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{
    background:var(--paper); color:var(--ink);
    font-family:'Inter',system-ui,-apple-system,sans-serif;
    -webkit-font-smoothing:antialiased;min-height:100vh;
    font-size:calc(16px * var(--fs));
    background-image:radial-gradient(circle at 100% 0%, rgba(224,177,94,.06), transparent 42%),
                     radial-gradient(circle at 0% 100%, rgba(18,48,46,.05), transparent 40%);
    background-attachment:fixed;
  }
  .wrap{max-width:560px;margin:0 auto;padding:0 0 calc(96px + env(safe-area-inset-bottom))}
  button{font-family:inherit;cursor:pointer}
  .serif{font-family:'Fraunces',Georgia,serif}
  .eyebrow{font-size:calc(11px * var(--fs));letter-spacing:2.5px;text-transform:uppercase;font-weight:600}
  .hidden{display:none !important}

  /* ---------- Login ---------- */
  #login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
  .login-card{width:100%;max-width:400px;background:var(--card);border-radius:22px;box-shadow:var(--shadow);overflow:hidden}
  .login-head{background:var(--ink);color:var(--paper);padding:32px 30px 28px;position:relative;overflow:hidden}
  .login-head::after{content:"";position:absolute;right:-40px;top:-40px;width:160px;height:160px;border-radius:50%;background:radial-gradient(circle,rgba(224,177,94,.16),transparent 70%);pointer-events:none}
  .logo-mark{display:flex;gap:11px;align-items:center;margin-bottom:20px;position:relative}
  .login-head h1{margin:0;font-size:calc(26px * var(--fs));font-weight:600;line-height:1.1;position:relative}
  .login-head p{margin:10px 0 0;font-size:calc(14px * var(--fs));opacity:.85;line-height:1.45;position:relative}
  .login-body{padding:26px 30px 30px}
  .field{margin-bottom:15px}
  .field label{display:block;font-size:calc(12.5px * var(--fs));font-weight:600;color:var(--muted);margin-bottom:7px}
  .field input{width:100%;padding:13px 14px;border-radius:12px;border:1.5px solid var(--line);font-size:calc(16px * var(--fs));font-family:inherit;color:var(--ink);background:#FCFBF6;outline:none;transition:border-color .15s,box-shadow .15s}
  .field input:focus{border-color:var(--ink);box-shadow:0 0 0 3px rgba(18,48,46,.10)}
  .btn-primary{width:100%;padding:14px;border:none;border-radius:12px;background:var(--ink);color:var(--paper);font-size:calc(16px * var(--fs));font-weight:600;margin-top:6px;transition:transform .12s}
  .btn-primary:active{transform:scale(.985)}
  .btn-primary:disabled{opacity:.5}
  .login-msg{font-size:calc(13.5px * var(--fs));margin-top:14px;line-height:1.4;min-height:18px}
  .login-msg.err{color:#B23A1E}
  .login-foot{text-align:center;font-size:calc(12px * var(--fs));color:var(--muted);padding:0 30px 24px}

  #config-warn{margin:24px;padding:20px 22px;border-radius:16px;background:#FBEDE7;border:1px solid #E1785A;color:#8A3A24;font-size:15px;line-height:1.55}
  #config-warn code{background:#fff;padding:1px 6px;border-radius:5px;font-size:13px}

  /* ---------- Header ---------- */
  header.app{background:var(--ink);color:var(--paper);padding:20px 22px 20px;border-radius:0 0 24px 24px;position:relative;overflow:hidden}
  header.app::after{content:"";position:absolute;right:-50px;top:-60px;width:190px;height:190px;border-radius:50%;background:radial-gradient(circle,rgba(224,177,94,.13),transparent 70%);pointer-events:none}
  .head-row{display:flex;justify-content:space-between;align-items:center;gap:10px;position:relative}
  .brand{display:flex;align-items:center;gap:9px;min-width:0}
  .brand .eyebrow{opacity:.75;font-size:calc(10.5px * var(--fs));letter-spacing:1.8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .head-right{display:flex;align-items:center;gap:8px;flex-shrink:0}
  .iconBtn{background:rgba(255,255,255,.10);border:none;color:var(--paper);width:34px;height:34px;border-radius:9px;font-size:15px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;padding:0}
  .iconBtn.on{background:var(--amber);color:var(--ink)}
  .logoutBtn{background:rgba(255,255,255,.10);border:none;color:var(--paper);font-size:calc(12px * var(--fs));padding:8px 11px;border-radius:9px;font-weight:500;white-space:nowrap}
  .head-date{font-size:calc(14.5px * var(--fs));opacity:.88;margin-top:14px;text-transform:capitalize;position:relative}

  .pyr-strip{display:flex;gap:5px;margin-top:14px;position:relative}
  .pyr-seg{flex:1;height:6px;border-radius:3px;background:rgba(255,255,255,.16)}
  .pyr-seg.active{background:var(--amber)}
  .pyr-seg.done{background:rgba(224,177,94,.5)}
  .pyr-label{display:flex;justify-content:space-between;margin-top:7px;font-size:calc(10px * var(--fs));letter-spacing:.3px;opacity:.65;position:relative}
  .pyr-label span{flex:1;text-align:center}
  .pyr-label span.on{opacity:1;color:var(--amber);font-weight:600}

  .tabs{display:flex;gap:7px;margin-top:18px;position:relative}
  .tabs button{flex:1;padding:10px 0;border-radius:11px;border:none;font-size:calc(13.5px * var(--fs));font-weight:600;background:rgba(255,255,255,.10);color:var(--paper);transition:background .15s,color .15s}
  .tabs button.active{background:var(--paper);color:var(--ink)}

  main{padding:20px 18px 0}

  /* editing-banner */
  .edit-banner{display:flex;align-items:center;gap:10px;background:var(--amber);color:var(--ink);border-radius:12px;padding:11px 14px;margin-bottom:16px;font-size:calc(13.5px * var(--fs));font-weight:600}
  .edit-banner button{margin-left:auto;background:var(--ink);color:var(--paper);border:none;padding:6px 12px;border-radius:8px;font-size:calc(12.5px * var(--fs));font-weight:600}

  /* ---------- Focus card ---------- */
  .focus{background:var(--card);border-radius:20px;overflow:hidden;box-shadow:var(--shadow)}
  .focus-top{padding:22px 22px 22px;color:#fff;position:relative;overflow:hidden}
  .focus-top::before{content:"";position:absolute;inset:0;background:linear-gradient(135deg,rgba(255,255,255,.08),transparent 55%);pointer-events:none}
  .focus-grid{display:flex;align-items:center;gap:18px;position:relative}
  .ring{position:relative;width:82px;height:82px;flex-shrink:0}
  .ring svg{display:block}
  .ring .rnum{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1}
  .ring .rnum b{font-size:calc(22px * var(--fs));font-weight:700;font-family:'Fraunces',serif}
  .ring .rnum small{font-size:calc(10px * var(--fs));opacity:.85;margin-top:1px}
  .focus-meta{min-width:0}
  .focus-meta .eyebrow{opacity:.85}
  .focus-name{font-size:calc(29px * var(--fs));font-weight:600;margin-top:5px;letter-spacing:-.3px}
  .focus-tag{font-size:calc(14.5px * var(--fs));opacity:.9;margin-top:1px}
  .focus-q{margin:18px 0 0;background:rgba(255,255,255,.14);border-radius:13px;padding:13px 15px;font-size:calc(15px * var(--fs));line-height:1.4;position:relative;border:1px solid rgba(255,255,255,.10)}
  .focus-q em{font-style:normal;font-family:'Fraunces',serif;font-size:calc(15.5px * var(--fs))}
  .focus-q .qlab{display:block;font-size:calc(10.5px * var(--fs));letter-spacing:1.5px;text-transform:uppercase;opacity:.75;margin-bottom:4px;font-weight:600}

  .beh-wrap{padding:18px 20px 6px}
  .beh-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
  .beh-head .eyebrow{color:var(--muted);letter-spacing:1.5px}
  .badge{font-size:calc(12px * var(--fs));font-weight:700;padding:4px 11px;border-radius:20px;background:var(--paper2);color:#8A928C;white-space:nowrap;transition:all .2s}
  .row{display:flex;align-items:flex-start;gap:13px;width:100%;text-align:left;background:transparent;border:none;padding:12px 0;border-top:1px solid var(--line2)}
  .row:first-of-type{border-top:none}
  .row span.txt{font-size:calc(15.5px * var(--fs));line-height:1.38;color:#39443F;transition:color .15s}
  .row.on span.txt{color:var(--ink)}
  .chk{width:25px;height:25px;border-radius:7px;flex-shrink:0;border:2px solid #B7BFB9;display:inline-flex;align-items:center;justify-content:center;transition:all .18s cubic-bezier(.34,1.56,.64,1);margin-top:1px}
  .chk svg{display:none}
  .chk.on svg{display:block}
  .chk.pop{animation:pop .3s cubic-bezier(.34,1.56,.64,1)}
  @keyframes pop{0%{transform:scale(.7)}60%{transform:scale(1.15)}100%{transform:scale(1)}}
  .crit{margin:8px 20px 20px;border-radius:14px;padding:15px 17px;position:relative}
  .crit .eyebrow{letter-spacing:1.5px}
  .crit p{margin:6px 0 0;font-size:calc(15px * var(--fs));line-height:1.42;color:#283734}

  .done-banner{margin:0 20px 18px;border-radius:14px;padding:14px 16px;background:linear-gradient(120deg,var(--amber),#EBC989);color:var(--ink);display:flex;align-items:center;gap:12px;font-size:calc(14.5px * var(--fs));font-weight:600;box-shadow:0 4px 16px rgba(224,177,94,.35);animation:rise .4s ease}
  @keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

  /* ---------- Quick check ---------- */
  .quick{margin-top:16px;background:var(--ink);color:var(--paper);border-radius:20px;padding:20px 20px 22px;position:relative;overflow:hidden}
  .quick::after{content:"";position:absolute;left:-40px;bottom:-50px;width:150px;height:150px;border-radius:50%;background:radial-gradient(circle,rgba(224,177,94,.10),transparent 70%);pointer-events:none}
  .quick-head{display:flex;justify-content:space-between;align-items:center;position:relative;margin-bottom:4px}
  .quick-head strong{font-size:calc(16px * var(--fs));font-weight:600}
  .quick-head span{font-size:calc(12.5px * var(--fs));opacity:.75}
  .qrow{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:transparent;border:none;padding:13px 0;border-top:1px solid rgba(255,255,255,.10);position:relative;min-height:48px}
  .qrow:first-of-type{border-top:none}
  .qrow:last-of-type{padding-bottom:4px}
  .qrow span.txt{font-size:calc(15px * var(--fs));color:rgba(245,242,233,.85);transition:color .15s}
  .qrow.on span.txt{color:#fff}

  /* ---------- Note ---------- */
  .note{margin-top:16px;background:var(--card);border-radius:20px;padding:19px 20px;box-shadow:var(--shadow-sm)}
  .note label{font-size:calc(11px * var(--fs));letter-spacing:1.5px;text-transform:uppercase;color:var(--muted);font-weight:700}
  .note textarea{width:100%;margin-top:10px;resize:vertical;border-radius:12px;border:1.5px solid var(--line);padding:12px 13px;font-size:calc(15px * var(--fs));line-height:1.45;font-family:inherit;color:var(--ink);background:#FCFBF6;outline:none;transition:border-color .15s}
  .note textarea:focus{border-color:var(--ink)}
  .saved{font-size:calc(12.5px * var(--fs));color:#2E7D5B;opacity:0;transition:opacity .2s;height:16px;margin-top:5px;display:block;font-weight:600}
  .saved.show{opacity:1}

  /* remind button */
  .remind{margin-top:16px;width:100%;background:var(--card);border:1.5px solid var(--line);border-radius:16px;padding:15px 18px;display:flex;align-items:center;gap:13px;box-shadow:var(--shadow-sm);text-align:left;color:var(--ink)}
  .remind .ic{width:38px;height:38px;border-radius:10px;background:var(--amber);color:var(--ink);display:flex;align-items:center;justify-content:center;font-size:19px;flex-shrink:0}
  .remind .t{font-size:calc(14.5px * var(--fs));font-weight:600;display:block}
  .remind .s{font-size:calc(12.5px * var(--fs));color:var(--muted);margin-top:2px;display:block}

  .footnote{text-align:center;font-size:calc(12.5px * var(--fs));color:#98A099;margin-top:22px;line-height:1.55;padding:0 16px}

  /* ---------- Week ---------- */
  .week-card{background:var(--card);border-radius:20px;padding:22px 20px 10px;box-shadow:var(--shadow)}
  .week-card h2{margin:0;font-size:calc(20px * var(--fs));font-weight:600}
  .week-card .sub{font-size:calc(13.5px * var(--fs));color:var(--muted);margin:5px 0 6px;line-height:1.4}
  .streak{display:flex;align-items:center;gap:8px;margin:14px 0 4px;padding:12px 14px;background:var(--paper2);border-radius:12px;font-size:calc(13.5px * var(--fs));color:var(--ink)}
  .streak b{font-family:'Fraunces',serif;font-size:calc(17px * var(--fs))}
  .wrow{display:flex;align-items:center;gap:14px;padding:13px 0;border-top:1px solid var(--line2);width:100%;background:transparent;border-left:none;border-right:none;border-bottom:none;text-align:left}
  .wrow:first-of-type{border-top:none}
  .wrow .wbar{width:9px;height:42px;border-radius:5px;flex-shrink:0}
  .wrow .name{font-size:calc(15px * var(--fs));font-weight:600}
  .wrow .date{font-size:calc(12.5px * var(--fs));color:#98A099;text-transform:capitalize;margin-top:1px}
  .wrow .chev{color:#C2C9C0;font-size:18px;margin-left:2px}
  .empty{padding:26px 0 30px;text-align:center;color:#98A099;font-size:calc(15px * var(--fs));line-height:1.5}
  .week-tip{margin-top:16px;background:var(--ink);color:var(--paper);border-radius:18px;padding:18px 20px;font-size:calc(13px * var(--fs));opacity:.96;line-height:1.55}
  .week-tip strong{color:var(--amber)}
  .tools{display:flex;gap:10px;margin-top:14px}
  .tools button{flex:1;padding:12px;border-radius:12px;border:1.5px solid var(--line);background:#fff;color:var(--ink);font-size:calc(14px * var(--fs));font-weight:600}
  .tools button:active{background:var(--paper2)}
  .tools button.danger{border-color:#E7C4B8;color:#A23E22}

  /* ---------- Uitleg ---------- */
  .ex-intro{background:var(--ink);color:var(--paper);border-radius:20px;padding:22px 22px;box-shadow:var(--shadow);position:relative;overflow:hidden}
  .ex-intro::after{content:"";position:absolute;right:-40px;bottom:-50px;width:150px;height:150px;border-radius:50%;background:radial-gradient(circle,rgba(224,177,94,.12),transparent 70%);pointer-events:none}
  .ex-intro h2{margin:0 0 8px;font-size:calc(21px * var(--fs));font-weight:600}
  .ex-intro p{margin:0;font-size:calc(14px * var(--fs));line-height:1.5;opacity:.9}
  .ex-card{background:var(--card);border-radius:18px;padding:0;box-shadow:var(--shadow-sm);margin-top:14px;overflow:hidden}
  .ex-top{padding:16px 18px;color:#fff;display:flex;align-items:center;gap:13px}
  .ex-num{width:34px;height:34px;border-radius:9px;background:rgba(255,255,255,.18);display:flex;align-items:center;justify-content:center;font-weight:700;font-family:'Fraunces',serif;font-size:calc(16px * var(--fs));flex-shrink:0}
  .ex-top .exn{font-size:calc(18px * var(--fs));font-weight:600}
  .ex-top .ext{font-size:calc(12.5px * var(--fs));opacity:.9}
  .ex-body{padding:16px 18px 18px}
  .ex-body .lbl{font-size:calc(10.5px * var(--fs));letter-spacing:1.5px;text-transform:uppercase;font-weight:700;color:var(--muted);margin-bottom:4px}
  .ex-body p{margin:0 0 14px;font-size:calc(14.5px * var(--fs));line-height:1.5;color:#2C3B37}
  .ex-body p:last-child{margin-bottom:0}
  .ex-q{font-family:'Fraunces',serif;font-style:italic;color:var(--ink)}

  /* ---------- Toast ---------- */
  #toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--paper);padding:13px 20px;border-radius:12px;font-size:calc(14px * var(--fs));font-weight:500;box-shadow:0 8px 30px rgba(0,0,0,.25);opacity:0;transition:all .3s;z-index:50;max-width:90%;text-align:center}
  #toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  #toast.err{background:#8A3A24}

  /* weekend rustscherm */
  .rest{background:var(--card);border-radius:20px;box-shadow:var(--shadow);padding:38px 26px 32px;text-align:center}
  .rest-emoji{font-size:44px;line-height:1;margin-bottom:10px}
  .rest h2{margin:0 0 8px;font-size:calc(22px * var(--fs));font-weight:600;color:var(--ink)}
  .rest p{margin:0 auto;max-width:340px;font-size:calc(15px * var(--fs));line-height:1.5;color:#4A5651}
  .rest-back{margin-top:20px;background:var(--ink);color:var(--paper);border:none;padding:11px 20px;border-radius:11px;font-size:calc(14px * var(--fs));font-weight:600}

  /* accessibility */
  .row:focus-visible,.qrow:focus-visible,.wrow:focus-visible,.tabs button:focus-visible,.tools button:focus-visible,.logoutBtn:focus-visible,.iconBtn:focus-visible,.btn-primary:focus-visible,.remind:focus-visible,.edit-banner button:focus-visible,.rest-back:focus-visible{outline:2.5px solid var(--amber);outline-offset:2px;border-radius:8px}
  @media (prefers-reduced-motion: reduce){*{animation-duration:.001ms !important;transition-duration:.001ms !important}}
</style>
</head>

  const keys=[]; let c=new Date(key+"T12:00:00");
  let guard=0;
  while(keys.length<40 && guard<120){ const k=todayKey(c); if(!isWeekend(c)) keys.unshift(k); c=new Date(c.getTime()-86400000); guard++; }
  let prevIdx=_rawIdx(keys[0]);
  for(let i=1;i<keys.length;i++){
    let idx=_rawIdx(keys[i]);
    if(idx===prevIdx){ const step=1+(_hash(keys[i],777)%(LAYERS.length-1)); idx=(idx+step)%LAYERS.length; if(idx===prevIdx) idx=(idx+1)%LAYERS.length; }
    prevIdx=idx;
  }
  return prevIdx;
}
function dutchDate(d=new Date()){
  if(!(d instanceof Date)) d=new Date(d+"T12:00:00");
  const days=["zondag","maandag","dinsdag","woensdag","donderdag","vrijdag","zaterdag"];
  const m=["januari","februari","maart","april","mei","juni","juli","augustus","september","oktober","november","december"];
  return `${days[d.getDay()]} ${d.getDate()} ${m[d.getMonth()]}`;
}
const CHECK_SVG = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none"><path d="M5 13l4 4L19 7" stroke="#fff" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/></svg>';
const esc = s => (s||"").replace(/[&<>"']/g, c=>({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));

const CONFIG_OK = !JSON.stringify(firebaseConfig).includes("VERVANG_MIJ");
let app, auth, db, user=null;
let state = { beh:{}, quick:[false,false,false,false,false], note:"" };
let currentTab = "today";
let selectedDay = todayKey();   // welke dag we tonen/bewerken
let saveTimer=null;

// tekstgrootte
const FS_STEPS=[1,1.15,1.3];
let fsIdx = parseInt(localStorage.getItem("fsIdx")||"0",10)||0;
function applyFs(){ document.documentElement.style.setProperty("--fs", FS_STEPS[fsIdx]); const b=document.getElementById("fontBtn"); if(b){ b.classList.toggle("on", fsIdx>0);} }
applyFs();
document.getElementById("fontBtn").addEventListener("click", ()=>{ fsIdx=(fsIdx+1)%FS_STEPS.length; localStorage.setItem("fsIdx",fsIdx); applyFs(); });

function toast(msg, isErr){
  const t=document.getElementById("toast");
  t.textContent=msg; t.className="show"+(isErr?" err":"");
  setTimeout(()=>t.className=t.className.replace("show",""),2600);
}

function showConfigWarning(){
  document.getElementById("login").innerHTML =
    '<div id="config-warn">⚙️ <strong>Nog even instellen.</strong><br><br>' +
    'De app is nog niet gekoppeld aan Firebase. Open <code>index.html</code>, zoek bovenaan het blok ' +
    '<code>firebaseConfig</code> en vervang de <code>VERVANG_MIJ</code>-waarden met je eigen gegevens uit de Firebase-console. ' +
    'De stappen staan in <code>HANDLEIDING.md</code>.</div>';
  document.getElementById("login").style.display="block";
}

if(!CONFIG_OK){
  showConfigWarning();
} else {
  app = initializeApp(firebaseConfig);
  auth = getAuth(app);
  db = getFirestore(app);
  setPersistence(auth, browserLocalPersistence);
  onAuthStateChanged(auth, async (u)=>{
    if(u){
      user=u;
      document.getElementById("login").classList.add("hidden");
      document.getElementById("app").classList.remove("hidden");
      selectedDay=todayKey();
      await loadDay(selectedDay);
      render();
    } else {
      user=null;
      document.getElementById("app").classList.add("hidden");
      document.getElementById("login").classList.remove("hidden");
    }
  });
}

const loginBtn = document.getElementById("loginBtn");
const loginMsg = document.getElementById("loginMsg");
async function doLogin(){
  const email = document.getElementById("email").value.trim();
  const pw = document.getElementById("pw").value;
  if(!email || !pw){ loginMsg.className="login-msg err"; loginMsg.textContent="Vul e-mail en wachtwoord in."; return; }
  loginBtn.disabled=true; loginMsg.className="login-msg"; loginMsg.textContent="Bezig met inloggen…";
  try{ await signInWithEmailAndPassword(auth, email, pw); loginMsg.textContent=""; }
  catch(e){
    loginMsg.className="login-msg err";
    const code=(e&&e.code)||"";
    loginMsg.textContent = code.includes("invalid-cred")||code.includes("wrong-password")||code.includes("user-not-found")
      ? "E-mail of wachtwoord klopt niet." : code.includes("too-many")
      ? "Te veel pogingen. Probeer het straks opnieuw." : "Inloggen lukte niet. Controleer je gegevens.";
  }finally{ loginBtn.disabled=false; }
}
if(loginBtn){
  loginBtn.addEventListener("click", doLogin);
  document.getElementById("pw").addEventListener("keydown", e=>{ if(e.key==="Enter") doLogin(); });
  document.getElementById("email").addEventListener("keydown", e=>{ if(e.key==="Enter") document.getElementById("pw").focus(); });
}
document.getElementById("logoutBtn").addEventListener("click", ()=> signOut(auth));

function docRef(dayKey){ return doc(db, "users", user.uid, "days", dayKey); }
async function loadDay(dayKey){
  state = { beh:{}, quick:[false,false,false,false,false], note:"", savedFocusIdx:null };
  try{
    const snap = await getDoc(docRef(dayKey));
    if(snap.exists()){
      const d=snap.data();
      state.beh=d.beh||{};
      state.quick=d.quick||[false,false,false,false,false];
      state.note=d.note||"";
      if(typeof d.focusIdx==="number") state.savedFocusIdx=d.focusIdx;
    }
  }catch(e){}
}
// Welke laag hoort bij de nu geselecteerde dag?
// Voor een reeds opgeslagen dag: gebruik de laag die tóén is bewaard (zodat vinkjes kloppen).
// Voor een nieuwe/lege dag: bereken hem met de rotatie.
function layerIdxForSelected(){
  if(state.savedFocusIdx!==null && state.savedFocusIdx!==undefined) return state.savedFocusIdx;
  return focusIndexFor(selectedDay);
}
async function save(){
  // gebruik de al opgeslagen laag als die er is, anders de berekende van vandaag
  const focusIdx = (state.savedFocusIdx!==null && state.savedFocusIdx!==undefined) ? state.savedFocusIdx : focusIndexFor(selectedDay);
  state.savedFocusIdx = focusIdx; // vanaf nu ligt de laag voor deze dag vast
  const payload = { beh:state.beh, quick:state.quick, note:state.note, focusIdx, ts: new Date(selectedDay+"T12:00:00").getTime() };
  try{ await setDoc(docRef(selectedDay), payload, { merge:true }); flashSaved(); }catch(e){}
}
function queueSave(){ clearTimeout(saveTimer); saveTimer=setTimeout(save, 400); }
function flashSaved(){ const el=document.getElementById("savedFlag"); if(el){ el.classList.add("show"); setTimeout(()=>el.classList.remove("show"),1200);} }

document.getElementById("tabToday").addEventListener("click", async ()=>{ currentTab="today"; selectedDay=todayKey(); await loadDay(selectedDay); setTabUI(); render(); });
document.getElementById("tabWeek").addEventListener("click", ()=>{ currentTab="week"; setTabUI(); render(); });
document.getElementById("tabExplain").addEventListener("click", ()=>{ currentTab="explain"; setTabUI(); render(); });
function setTabUI(){
  document.getElementById("tabToday").classList.toggle("active", currentTab==="today");
  document.getElementById("tabWeek").classList.toggle("active", currentTab==="week");
  document.getElementById("tabExplain").classList.toggle("active", currentTab==="explain");
}

function renderHeader(){
  document.getElementById("dateLabel").textContent = dutchDate(new Date());
  const strip=document.getElementById("pyrStrip");
  const label=document.getElementById("pyrLabel");
  strip.innerHTML=""; label.innerHTML="";
  const weekendNow = isWeekend(todayKey());
  const todayIdx = weekendNow ? -1 : focusIndexFor(todayKey());
  LAYERS.forEach((L,i)=>{
    const seg=document.createElement("div");
    seg.className="pyr-seg"+(i===todayIdx?" active":"");
    strip.appendChild(seg);
    const sp=document.createElement("span");
    sp.textContent=L.short; if(i===todayIdx) sp.className="on";
    label.appendChild(sp);
  });
}

function render(){
  renderHeader();
  const view=document.getElementById("view");
  if(currentTab==="today") renderDay(view);
  else if(currentTab==="week") renderWeek(view);
  else renderExplain(view);
}

function ringSVG(pct){
  const r=36, c=2*Math.PI*r, off=c*(1-pct);
  return `<svg width="82" height="82" viewBox="0 0 82 82"><g transform="rotate(-90 41 41)">
    <circle cx="41" cy="41" r="${r}" fill="none" stroke="rgba(255,255,255,.22)" stroke-width="6"/>
    <circle cx="41" cy="41" r="${r}" fill="none" stroke="#fff" stroke-width="6" stroke-linecap="round"
      stroke-dasharray="${c.toFixed(1)}" stroke-dashoffset="${off.toFixed(1)}" style="transition:stroke-dashoffset .5s cubic-bezier(.4,0,.2,1)"/>
    </g></svg>`;
}

function renderDay(view){
  const isToday = selectedDay===todayKey();

  // Weekend: geen dagstart, toon een rustig scherm
  if(isWeekend(selectedDay)){
    const backBtn = isToday ? "" :
      `<button class="rest-back" id="backToday">Terug naar vandaag</button>`;
    view.innerHTML = `
      ${isToday ? "" : `<div class="edit-banner">✎ Je bekijkt ${dutchDate(selectedDay)}<button id="backToday2">Terug naar vandaag</button></div>`}
      <section class="rest">
        <div class="rest-emoji">🌿</div>
        <h2 class="serif">Geen dagstart vandaag</h2>
        <p>Het is weekend — geniet ervan. Maandag pak je de draad weer op met een nieuwe laag.</p>
        ${backBtn}
      </section>
      <section class="week-tip" style="margin-top:16px"><strong>Tip:</strong> gebruik het rustige moment gerust om via <em>Uitleg</em> nog eens een laag door te nemen.</section>
    `;
    const b1=view.querySelector("#backToday"), b2=view.querySelector("#backToday2");
    const goBack=async ()=>{ currentTab="today"; selectedDay=todayKey(); await loadDay(selectedDay); setTabUI(); render(); window.scrollTo({top:0,behavior:"smooth"}); };
    if(b1) b1.addEventListener("click", goBack);
    if(b2) b2.addEventListener("click", goBack);
    return;
  }

  const idx=layerIdxForSelected(); const L=LAYERS[idx];
  const beh=state.beh[L.key]||[false,false,false,false,false];
  const behCount=beh.filter(Boolean).length;
  const quickCount=state.quick.filter(Boolean).length;

  const editBanner = isToday ? "" :
    `<div class="edit-banner">✎ Je bewerkt ${dutchDate(selectedDay)}<button id="backToday">Terug naar vandaag</button></div>`;

  const remindBtn = (isToday && NTFY_TOPIC) ?
    `<button class="remind" id="remindBtn">
       <span class="ic">🔔</span>
       <span><span class="t">Stuur mij een herinnering</span><span class="s">Push de focus van vandaag naar je telefoon</span></span>
     </button>` : "";

  view.innerHTML = `
    ${editBanner}
    <section class="focus">
      <div class="focus-top" style="background:${L.color}">
        <div class="focus-grid">
          <div class="ring">${ringSVG(behCount/5)}<div class="rnum"><b>${behCount}</b><small>van 5</small></div></div>
          <div class="focus-meta">
            <div class="eyebrow">${isToday?"Vandaag":"Deze dag"} · Laag ${idx+1} van 5</div>
            <div class="focus-name serif">${L.name}</div>
            <div class="focus-tag">${L.tagline}</div>
          </div>
        </div>
        <div class="focus-q"><span class="qlab">Vraag om te stellen</span><em>“${esc(L.question)}”</em></div>
      </div>
      <div class="beh-wrap">
        <div class="beh-head">
          <span class="eyebrow">Vink af wat je ${isToday?"vandaag":"die dag"} deed</span>
          <span class="badge" id="behBadge">${behCount}/5</span>
        </div>
        <div id="behList"></div>
      </div>
      <div id="doneSlot"></div>
      <div class="crit" style="background:${L.tint}">
        <div class="eyebrow" style="color:${L.color}">Kritische check</div>
        <p>${esc(L.check)}</p>
      </div>
    </section>

    <section class="quick">
      <div class="quick-head"><strong>Dagstart quick check</strong><span>30 sec · <span id="quickCount">${quickCount}</span>/5</span></div>
      <div id="quickList"></div>
    </section>

    ${remindBtn}

    <section class="note">
      <label for="noteInput">Notitie van ${isToday?"vandaag":"deze dag"}</label>
      <textarea id="noteInput" rows="3" placeholder="Wat viel op? Wat neem je mee naar morgen?">${esc(state.note)}</textarea>
      <span class="saved" id="savedFlag">✓ Opgeslagen</span>
    </section>

    <p class="footnote">Elke dag belicht de app een andere laag. Kleine, dagelijkse herhaling zorgt voor duurzame verandering.</p>
  `;

  if(!isToday){ view.querySelector("#backToday").addEventListener("click", async ()=>{ currentTab="today"; selectedDay=todayKey(); await loadDay(selectedDay); setTabUI(); render(); }); }
  if(isToday && NTFY_TOPIC){ view.querySelector("#remindBtn").addEventListener("click", ()=>sendReminder(L, idx)); }

  const behList=view.querySelector("#behList");
  L.behaviors.forEach((b,i)=>{
    const btn=document.createElement("button");
    btn.className="row"+(beh[i]?" on":"");
    btn.innerHTML=`<span class="chk${beh[i]?" on":""}" style="${beh[i]?`background:${L.color};border-color:${L.color}`:""}">${CHECK_SVG}</span><span class="txt">${esc(b)}</span>`;
    btn.addEventListener("click",()=>{
      const arr=(state.beh[L.key]||[false,false,false,false,false]).slice();
      arr[i]=!arr[i]; state.beh[L.key]=arr;
      const c=arr.filter(Boolean).length;
      const badge=view.querySelector("#behBadge");
      badge.textContent=`${c}/5${c>=3?" · goed bezig":""}`;
      badge.style.background=c>=3?L.tint:"var(--paper2)"; badge.style.color=c>=3?L.color:"#8A928C";
      btn.classList.toggle("on",arr[i]);
      const chk=btn.querySelector(".chk");
      chk.classList.toggle("on",arr[i]);
      if(arr[i]){ chk.classList.add("pop"); setTimeout(()=>chk.classList.remove("pop"),300); }
      chk.style.cssText=arr[i]?`background:${L.color};border-color:${L.color}`:"";
      view.querySelector(".ring").innerHTML=ringSVG(c/5)+`<div class="rnum"><b>${c}</b><small>van 5</small></div>`;
      updateDoneSlot(view,L);
      queueSave();
    });
    behList.appendChild(btn);
  });
  const badge=view.querySelector("#behBadge");
  if(behCount>=3){ badge.textContent=`${behCount}/5 · goed bezig`; badge.style.background=L.tint; badge.style.color=L.color; }

  const qList=view.querySelector("#quickList");
  QUICK.forEach((q,i)=>{
    const btn=document.createElement("button");
    btn.className="qrow"+(state.quick[i]?" on":"");
    btn.innerHTML=`<span class="chk${state.quick[i]?" on":""}" style="${state.quick[i]?`background:${AMBER};border-color:${AMBER}`:""}">${CHECK_SVG}</span><span class="txt">${esc(q)}</span>`;
    btn.addEventListener("click",()=>{
      state.quick[i]=!state.quick[i];
      btn.classList.toggle("on",state.quick[i]);
      const chk=btn.querySelector(".chk");
      chk.classList.toggle("on",state.quick[i]);
      if(state.quick[i]){ chk.classList.add("pop"); setTimeout(()=>chk.classList.remove("pop"),300); }
      chk.style.cssText=state.quick[i]?`background:${AMBER};border-color:${AMBER}`:"";
      view.querySelector("#quickCount").textContent=state.quick.filter(Boolean).length;
      updateDoneSlot(view,L);
      queueSave();
    });
    qList.appendChild(btn);
  });

  const ta=view.querySelector("#noteInput");
  ta.addEventListener("input",()=>{ state.note=ta.value; queueSave(); });

  updateDoneSlot(view,L);
}

function updateDoneSlot(view,L){
  const slot=view.querySelector("#doneSlot");
  if(!slot) return;
  const beh=state.beh[L.key]||[];
  const behCount=beh.filter(Boolean).length;
  const quickCount=state.quick.filter(Boolean).length;
  if(behCount===5 && quickCount===5){
    if(!slot.querySelector(".done-banner")){
      slot.innerHTML=`<div class="done-banner">✓ Alles afgevinkt. Sterk werk — tot morgen.</div>`;
    }
  } else { slot.innerHTML=""; }
}

async function sendReminder(L, idx){
  const btn=document.getElementById("remindBtn");
  if(btn) btn.disabled=true;
  try{
    const res = await fetch(`https://ntfy.sh/${NTFY_TOPIC}`, {
      method:"POST",
      headers:{ "Title":`Focus van vandaag: ${L.name}`, "Tags":"dart,muscle", "Priority":"default" },
      body:`Laag ${idx+1} · ${L.tagline}\nVraag om te stellen: “${L.question}”`
    });
    if(res.ok) toast("🔔 Herinnering verstuurd naar je telefoon");
    else toast("Versturen lukte niet. Check je topicnaam.", true);
  }catch(e){ toast("Geen verbinding. Probeer het opnieuw.", true); }
  finally{ if(btn) btn.disabled=false; }
}

async function fetchEntries(){
  let entries=[];
  try{
    const q=query(collection(db,"users",user.uid,"days"), orderBy("ts","desc"));
    const snap=await getDocs(q); snap.forEach(d=>entries.push({key:d.id,data:d.data()}));
  }catch(e){
    try{ const snap=await getDocs(collection(db,"users",user.uid,"days")); snap.forEach(d=>entries.push({key:d.id,data:d.data()})); entries.sort((a,b)=>a.key<b.key?1:-1);}catch(_){}
  }
  return entries;
}

async function renderWeek(view){
  view.innerHTML=`<section class="week-card"><h2 class="serif">Jouw laatste dagen</h2><p class="sub">Laden…</p></section>`;
  const entries=await fetchEntries();
  const recent=entries.slice(0,10);
  const goodDays = entries.filter(e=>{ const li=typeof e.data.focusIdx==="number"?e.data.focusIdx:0; const L=LAYERS[li]||LAYERS[0]; return ((e.data.beh&&e.data.beh[L.key])||[]).filter(Boolean).length>=3; }).length;

  const card=document.createElement("section");
  card.className="week-card";
  card.innerHTML=`<h2 class="serif">Jouw laatste dagen</h2>
    <p class="sub">Tik op een dag om die te openen of aan te passen. Drie of meer per laag betekent: goed bezig.</p>
    ${entries.length? `<div class="streak">🔥 <span><b>${goodDays}</b> ${goodDays===1?"dag":"dagen"} met 3+ vinkjes per laag</span></div>`:""}
    <div id="weekRows"></div>`;
  view.innerHTML="";
  view.appendChild(card);

  const rowsEl=card.querySelector("#weekRows");
  if(recent.length===0){
    rowsEl.innerHTML=`<div class="empty">Nog niets ingevuld.<br>Begin bij het tabblad <strong style="color:${INK}">Vandaag</strong>.</div>`;
  } else {
    recent.forEach(({key,data})=>{
      const li=typeof data.focusIdx==="number"?data.focusIdx:0;
      const L=LAYERS[li]||LAYERS[0];
      const beh=(data.beh&&data.beh[L.key])||[];
      const c=beh.filter(Boolean).length;
      const btn=document.createElement("button");
      btn.className="wrow";
      btn.innerHTML=`<div class="wbar" style="background:${L.color}"></div>
        <div style="flex:1;min-width:0"><div class="name">${L.name}</div><div class="date">${dutchDate(key)}</div></div>
        <div style="text-align:right"><span class="badge" style="${c>=3?`background:${L.tint};color:${L.color}`:""}">${c}/5</span>${data.note?`<div style="font-size:calc(11.5px * var(--fs));color:#A7AEAB;margin-top:4px">notitie ✓</div>`:""}</div>
        <span class="chev">›</span>`;
      btn.addEventListener("click", async ()=>{ selectedDay=key; currentTab="today"; await loadDay(key); setTabUI(); render(); window.scrollTo({top:0,behavior:"smooth"}); });
      rowsEl.appendChild(btn);
    });
  }

  const tools=document.createElement("div");
  tools.className="tools";
  tools.innerHTML=`<button id="exportBtn">Exporteer als tekst</button><button id="wipeBtn" class="danger">Wis mijn data</button>`;
  view.appendChild(tools);
  const tip=document.createElement("section");
  tip.className="week-tip";
  tip.innerHTML=`<strong>Onthoud:</strong> de checklist is een leerinstrument, geen controlelijst. Vul eerlijk in — zo wordt coaching concreter en minder afhankelijk van gevoel.`;
  view.appendChild(tip);

  tools.querySelector("#exportBtn").addEventListener("click", ()=>exportData(entries));
  tools.querySelector("#wipeBtn").addEventListener("click", ()=>wipeData(entries));
}

function renderExplain(view){
  let cards="";
  LAYERS.forEach((L,i)=>{
    cards+=`<section class="ex-card">
      <div class="ex-top" style="background:${L.color}">
        <div class="ex-num">${i+1}</div>
        <div><div class="exn serif">${L.name}</div><div class="ext">${L.tagline}</div></div>
      </div>
      <div class="ex-body">
        <div class="lbl">Wat het is</div><p>${esc(L.what)}</p>
        <div class="lbl">Waarom het telt</div><p>${esc(L.why)}</p>
        <div class="lbl">Vraag om te stellen</div><p class="ex-q">“${esc(L.question)}”</p>
      </div>
    </section>`;
  });
  view.innerHTML=`
    <section class="ex-intro">
      <h2 class="serif">De vijf lagen</h2>
      <p>Een sterk team bouwt van onder naar boven: vertrouwen maakt open discussie mogelijk, discussie maakt echt commitment mogelijk, en zo verder tot je samen resultaat boekt. Trek er één laag onderuit en de rest zakt mee.</p>
    </section>
    ${cards}
    <p class="footnote">Gebaseerd op het model van Patrick Lencioni — een denkkader om het gesprek te voeren, geen exacte wetenschap.</p>
  `;
}

function exportData(entries){
  let out=`Voorbeeldleiderschap — export voor ${user.email}\nGemaakt: ${new Date().toLocaleString("nl-BE")}\n\n`;
  entries.slice().sort((a,b)=>a.key<b.key?-1:1).forEach(({key,data})=>{
    const li=typeof data.focusIdx==="number"?data.focusIdx:0; const L=LAYERS[li]||LAYERS[0];
    const beh=(data.beh&&data.beh[L.key])||[]; const c=beh.filter(Boolean).length; const q=(data.quick||[]).filter(Boolean).length;
    out+=`${key} — ${L.name}: ${c}/5 gedragingen, quick check ${q}/5\n`;
    if(data.note) out+=`   notitie: ${data.note}\n`;
  });
  const blob=new Blob([out],{type:"text/plain;charset=utf-8"});
  const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download=`leiderschap-export-${todayKey()}.txt`; a.click(); URL.revokeObjectURL(a.href);
}
async function wipeData(entries){
  if(!confirm("Weet je zeker dat je al je opgeslagen dagen wilt verwijderen? Dit kan niet ongedaan worden gemaakt.")) return;
  for(const {key} of entries){ try{ await deleteDoc(doc(db,"users",user.uid,"days",key)); }catch(e){} }
  state={ beh:{}, quick:[false,false,false,false,false], note:"" }; selectedDay=todayKey();
  toast("Je gegevens zijn gewist."); currentTab="today"; setTabUI(); render();
}

// ---- PWA: service worker registreren ----
if("serviceWorker" in navigator){
  window.addEventListener("load", ()=>{ navigator.serviceWorker.register("sw.js").catch(()=>{}); });
}
